[project]
name = "verifier"
version = "0.1.0"
description = "Check a research paper for mistakes before you post or submit it."
readme = "README.md"
license = "MIT"                 # the text is in LICENSE, which setuptools adds itself
requires-python = ">=3.13"
dependencies = ["typst>=0.15,<0.16"]   # compiles the PDF report; the checks use only the standard library

[project.scripts]
verifier = "runtime.cli:main"        # start, watch and stop the real-time verifier
vcheck = "core.cli:main"             # the auditing agent's way into the deterministic core
vjob = "runtime.agent.jobs:vjob_main"   # run and watch the agent's long jobs
vwake = "runtime.agent.jobs:vwake_main" # wake the agent once, later

[build-system]
requires = ["setuptools>=77"]   # 77 reads the SPDX `license` expression
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["tests*", "evaluation*"]   # the evals are not part of the installed commands
namespaces = false              # only folders with __init__.py, so build/ and docs/ stay out

[tool.setuptools.package-data]
"core.claim_steps" = ["label_examples.json"]
diagnosis = ["guide.md"]
runtime = ["templates/*"]
"runtime.project" = ["cost_rates.json"]
utils = ["model_names.txt", "model_keys.json"]
web = ["page.html"]

[dependency-groups]
dev = ["ruff>=0.15", "mypy>=1.18"]   # lint, and the type check of the refactored modules

# Lint settings, on Python 3.13.
[tool.ruff]
target-version = "py313"
line-length = 100
# docs and the testbeds hold research scripts and saved runs, not the verifier's code.
# evaluation/stage2-ab holds bench scripts copied as-is from a local experiment.
extend-exclude = ["docs", "evaluation/tests/testbeds", "evaluation/examples",
                  "evaluation/stage2-ab"]

[tool.ruff.lint]
# E/F: pycodestyle+pyflakes. I: import sorting. B: bugbear. UP: pyupgrade.
# SIM: simplify. BLE: no blind except. ANN: type annotations. D: docstrings.
# TID: ban relative imports (absolute-only house style).
select = ["E", "F", "I", "B", "UP", "SIM", "BLE", "ANN", "D", "TID"]

[tool.ruff.lint.per-file-ignores]
# Tests need neither full type annotations nor docstrings.
"tests/**" = ["ANN", "D"]
"evaluation/tests/**" = ["ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# `mypy --strict` checks the modules that the OOP refactor rewrote. tests/test_type_check.py
# runs it, so CI runs it with the other tests. Each step of the refactor adds the modules it
# rewrites. Imported modules that are not listed are read for their types, and their own
# errors are not reported.
[tool.mypy]
strict = true
follow_imports = "silent"
