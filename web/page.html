<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verifier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
:root{
  --sand:#f4f2ec; --marble:#faf9f6; --paper:#fff; --ink:#1a1c2e; --ink-2:#3d4250;
  --muted:#5a6070; --faint:#8a8f9c; --rule:#d0cec8; --rule-2:#dedad2; --rule-3:#eeebe5;
  --sea:#1b3d6e; --red:#b32a23; --red-tint:#fbeceb; --red-rule:#efc9c6;
  --serif:"Source Serif 4",Georgia,serif; --sans:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--sand);color:var(--ink);font:400 14.5px/1.55 var(--sans);
     -webkit-font-smoothing:antialiased}
a{color:var(--sea);text-underline-offset:2px}
button{font-family:var(--sans)}
@keyframes vpulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes vslide{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.pulse{animation:vpulse 1.6s ease-in-out infinite}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.dot{display:inline-block;flex:none;width:7px;height:7px;border-radius:50%}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}

/* layout */
.shell{display:flex;flex-wrap:wrap;max-width:1440px;margin:0 auto;min-height:100vh}
aside{flex:0 1 300px;min-width:0;padding:28px 22px 40px;border-right:1px solid #e3dfd7;
      display:flex;flex-direction:column;gap:22px}
main{flex:1 1 560px;min-width:0;padding:28px clamp(18px,4vw,48px) 140px;display:flex;
     flex-direction:column;gap:22px}

/* sidebar */
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand b{font:600 24px/1 var(--serif);letter-spacing:-.01em}
.host{display:flex;align-items:center;gap:6px;font:400 11.5px/1 var(--mono);color:var(--muted)}
.drop{border:1.5px dashed #c9c6bf;background:var(--marble);border-radius:6px;padding:18px 16px;
      cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:background .15s,border-color .15s}
.drop:hover{border-color:var(--sea)}
.drop.over{border-color:var(--sea);background:#e8eef6}
.drop b{font-size:14px}
.drop span{font-size:12.5px;color:var(--muted);line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.file-chip{display:inline-flex;align-items:center;gap:6px;font:400 12px/1 var(--mono);background:#fff;
           border:1px solid var(--rule);border-radius:4px;padding:5px 7px}
.file-chip span{color:var(--faint)}
.btn{font:600 13.5px/1 var(--sans);background:var(--sea);color:#fff;border:0;border-radius:5px;
     padding:10px 16px;cursor:pointer}
.btn:disabled{background:#9aa6b8;cursor:default}
.btn-quiet{font:500 13px/1 var(--sans);background:transparent;color:var(--muted);border:0;padding:8px 4px;cursor:pointer}
.btn-line{font:500 12.5px/1 var(--sans);background:#fff;border:1px solid var(--rule);border-radius:5px;
          color:var(--sea);padding:7px 11px;cursor:pointer;text-decoration:none}
.btn-line:hover{border-color:var(--sea)}
.hint{font-size:12px;color:var(--muted);line-height:1.45}
.err-line{font-size:12.5px;color:var(--red);background:var(--red-tint);border:1px solid var(--red-rule);
          border-radius:4px;padding:8px 10px;white-space:pre-wrap}
.label{font:600 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.runs-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 8px 6px}
.runs-head .mono{font-size:11.5px;color:var(--faint)}
.run-item{display:flex;flex-direction:column;gap:5px;padding:10px;border-radius:6px;cursor:pointer;
          border:1px solid transparent}
.run-item:hover{background:var(--marble)}
.run-item.sel{background:var(--marble);border-color:var(--rule)}
.run-item .top{display:flex;align-items:center;gap:8px;min-width:0}
.run-item .name{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run-item .bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-left:15px}
.run-item .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font:600 10.5px/1 var(--sans);letter-spacing:.03em;border-radius:3px;padding:4px 6px;white-space:nowrap}

/* run header */
.empty{padding:120px 0;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.empty b{font:600 20px/1.3 var(--serif);color:var(--ink)}
.run-head{display:flex;flex-direction:column;gap:12px}
.run-head .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.run-id{font:400 11.5px/1 var(--mono);color:var(--faint);margin-bottom:6px}
.run-head h1{margin:0;font:600 28px/1.15 var(--serif);letter-spacing:-.01em;word-break:break-word}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pdf{font:600 13px/1 var(--sans);background:#fff;color:var(--sea);border:1px solid #c9c6bf;border-radius:5px;
     padding:9px 13px;white-space:nowrap;text-decoration:none}
.pdf:hover{border-color:var(--sea)}
.del{font:500 13px/1 var(--sans);background:transparent;color:var(--muted);border:0;padding:9px 10px;cursor:pointer}
.del:hover{color:var(--red)}
.confirm{display:flex;align-items:center;gap:8px;background:var(--red-tint);border:1px solid var(--red-rule);
         border-radius:5px;padding:4px 4px 4px 10px;font-size:12.5px;color:#7a1c17}
.confirm .keep{font:500 12.5px/1 var(--sans);background:transparent;border:0;color:var(--muted);padding:7px 8px;cursor:pointer}
.confirm .go{font:600 12.5px/1 var(--sans);background:var(--red);color:#fff;border:0;border-radius:4px;padding:7px 10px;cursor:pointer}
.status{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13px;color:var(--muted)}
.status .state{display:inline-flex;align-items:center;gap:7px;font-weight:600}
.file-tag{font:400 12px/1 var(--mono);color:var(--ink-2);background:#ebe8e1;border-radius:3px;padding:5px 7px}

/* panels */
.panel{background:var(--marble);border:1px solid var(--rule);border-radius:8px}
.steps{padding:18px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.step{display:flex;flex-direction:column;gap:6px}
.step .bar{height:3px;border-radius:2px}
.step b{font-size:13px}
.step span{font-size:12px;color:var(--muted);line-height:1.45}
.fail{background:#fff;border:1px solid var(--red-rule);border-radius:8px;overflow:hidden}
.fail .head{padding:14px 18px;border-bottom:1px solid #f3dcda;display:flex;flex-direction:column;gap:4px}
.fail .head b{font:600 16px/1.3 var(--serif);color:var(--red)}
.fail .head span{font-size:13px;color:var(--muted)}
.fail pre{margin:0;padding:14px 18px;font:400 12.5px/1.6 var(--mono);white-space:pre-wrap;color:var(--ink-2);background:#fdf8f7}
.notice{font-size:13px;color:#0b4f37;background:#e7f3ec;border:1px solid #c3e0cf;border-radius:6px;
        padding:10px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.notice button{background:transparent;border:0;color:#0b4f37;cursor:pointer;font:500 12.5px/1 var(--sans);padding:4px}

/* questions */
.ask-head{display:flex;align-items:center;gap:8px;color:#a15c07}
.ask-head .label{color:#a15c07}
.question{background:#fff;border:1px solid #e6d3b3;border-radius:8px;padding:18px 20px;display:flex;
          flex-direction:column;gap:12px}
.question .q{display:flex;gap:10px;align-items:baseline}
.question .q .mono{font-size:12px;color:#a15c07}
.question .q b{font:600 17px/1.4 var(--serif)}
.evidence{margin:0;font:400 12px/1.6 var(--mono);white-space:pre-wrap;background:#f7f5f0;border-radius:5px;
          padding:10px 12px;color:var(--ink-2)}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.option{text-align:left;background:var(--marble);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;
        cursor:pointer;display:flex;flex-direction:column;gap:3px;font:inherit;color:inherit}
.option:hover{border-color:var(--sea);background:#fff}
.option .mono{font-size:13px;color:var(--sea);font-weight:500}
.option span:last-child{font-size:12px;color:var(--muted);line-height:1.4}
.text-input{font:inherit;font-size:13px;border:1px solid var(--rule);border-radius:5px;padding:8px 10px;background:#fff;width:100%}

/* verdict */
.verdict{overflow:hidden}
.verdict .top{padding:20px 22px 18px;display:flex;flex-direction:column;gap:8px}
.verdict .eyebrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.verdict .commit{font:400 12px/1 var(--mono);color:var(--muted)}
.verdict .word{font:600 34px/1.05 var(--serif);letter-spacing:-.01em}
.verdict .action{font-weight:600;font-size:15px}
.verdict .reason{font-size:13px;color:var(--ink-2)}
.verdict .without{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:4px;padding-top:10px;
                  border-top:1px solid rgba(26,28,46,.1)}
.verdict .without span:first-child{font-size:13px;color:var(--muted)}
.verdict .without b{font:600 18px/1.2 var(--serif)}
.verdict dl{margin:0;padding:14px 22px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
            gap:14px 24px;border-top:1px solid #e3dfd7}
.verdict dt{font:600 11px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.verdict dd{margin:3px 0 0;font-size:13.5px;line-height:1.5;white-space:pre-line}

/* severity bar and filters */
.filters{position:sticky;top:0;z-index:5;margin:0 -8px;padding:10px 8px;background:rgba(244,242,236,.94);
         backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:10px;border-bottom:1px solid #e3dfd7}
.sevbar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;background:#e8e4de}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 12.5px/1 var(--sans);border-radius:999px;
      padding:7px 11px;cursor:pointer;background:#fff;color:var(--ink);border:1px solid var(--rule)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .sq{width:7px;height:7px;border-radius:2px}
.chip .n{opacity:.7}
.navlink{font:500 12.5px/1 var(--sans);background:transparent;border:0;color:var(--sea);padding:6px;cursor:pointer;
         text-decoration:underline;text-underline-offset:3px;text-decoration-color:#b9c4d6}

/* sections and groups */
.section{display:flex;flex-direction:column;gap:14px;scroll-margin-top:100px}
.section-head{display:flex;flex-direction:column;gap:4px;padding-top:8px}
.section-head h2{margin:0;font:600 21px/1.25 var(--serif)}
.section-head .note{font-size:13px;color:var(--muted)}
.section-head .warning{font-size:13px;color:var(--ink-2);font-style:italic}
.group{background:#fff;border:1px solid var(--rule-2);border-radius:8px;overflow:hidden;scroll-margin-top:100px}
.group-head{padding:14px 18px 12px;display:flex;flex-direction:column;gap:5px;background:#fcfbf9}
.group-head .line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.group-head .eyebrow{font-size:12px;color:var(--faint)}
.group-head .title{font:500 14px/1.3 var(--mono)}
.group-head .count{font-size:12px;color:var(--faint)}
.group-head .statement{font:italic 400 15px/1.45 var(--serif);color:#2b2e3f}
.group-head .small{font-size:12px;color:var(--muted)}
.row{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding:13px 18px;border-top:1px solid #f1eee8}
.row.picked{background:#f3f6fb}
.pick{width:18px;height:18px;border-radius:4px;border:1.5px solid #b9b6ae;background:#fff;color:#fff;
      font:700 11px/1 var(--sans);padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px}
.pick.on{background:var(--sea);border-color:var(--sea)}
.row-body{display:flex;flex-direction:column;gap:5px;min-width:0}
.row-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flag-id{font:400 11.5px/1 var(--mono);color:var(--faint)}
.subject{font:500 12.5px/1.3 var(--mono);color:var(--ink);word-break:break-all}
.code{font:500 12.5px/1.3 var(--mono);color:var(--ink-2)}
.spacer{flex:1}
.detail{font-size:13.5px;line-height:1.55}
.quote{font:italic 400 13px/1.5 var(--serif);color:var(--muted)}
.struck .row-line,.struck .detail,.struck .facts,.struck .long-facts{opacity:.55}
.struck .code,.struck .subject,.struck .detail{text-decoration:line-through}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--rule-3);
       border:1px solid var(--rule-3);border-radius:5px;overflow:hidden}
.facts div{background:#fcfbf9;padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.fact-k{font:600 10.5px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.facts .fact-v{font:500 15px/1.2 var(--mono)}
.long-facts{display:grid;grid-template-columns:minmax(120px,180px) minmax(0,1fr);gap:8px 16px;padding-top:4px}
.long-facts .fact-v{font-size:13.5px;line-height:1.55}
.long-facts p{margin:0 0 .35em}
.long-facts ul{margin:0;padding-left:1.2em}
.long-facts li{margin-bottom:.3em}
.disputed-note{display:flex;gap:8px;align-items:baseline;font-size:12.5px;color:#475467;background:#f2f1ee;
               border-radius:4px;padding:6px 9px}
.disputed-note .mono{font-size:11.5px;color:#667085;white-space:nowrap}
.same-note{padding:0 18px 12px;font-size:13.5px;background:#fcfbf9}
.cols{columns:2;column-gap:0}
.cols .row{break-inside:avoid}
.table-wrap{overflow-x:auto}
table.plain{border-collapse:collapse;width:100%;font-size:13px}
table.plain th{text-align:left;padding:8px 10px;font:600 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
table.plain td{padding:7px 10px;border-top:1px solid var(--rule-3);vertical-align:top}
table.plain th:first-child,table.plain td:first-child{padding-left:18px}
table.plain th:last-child,table.plain td:last-child{padding-right:18px}
table.plain .num{text-align:right;font-family:var(--mono)}
.fold{background:var(--marble);border:1px solid var(--rule-2);border-radius:8px;overflow:hidden}
.fold summary{padding:12px 18px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.fold summary b{font-size:13.5px}
.fold summary span{font-size:12px;color:var(--sea)}
.fold[open] summary span::before{content:"Hide";}
.fold[open] summary span{font-size:0}
.fold[open] summary span::before{font-size:12px}
.fold .inner{border-top:1px solid var(--rule-3)}
.fold h4{margin:14px 18px 4px;font-size:13px}
.filtered-empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}

/* disputes */
.none-yet{font-size:13px;color:var(--faint);border:1px dashed var(--rule);border-radius:8px;padding:16px 18px}
.dispute{background:#fff;border:1px solid var(--rule-2);border-radius:8px;padding:14px 18px;display:flex;
         flex-direction:column;gap:8px}
.dispute.withdrawn{opacity:.6}
.dispute .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dispute .ids{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dispute .ids>.mono{font-size:13px;font-weight:500}
.flag-chip{font:400 11.5px/1 var(--mono);background:#f2f1ee;border-radius:3px;padding:4px 6px;color:var(--ink-2)}
.state-pill{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--sans);border-radius:999px;padding:4px 8px}
.state-pill .dot{width:6px;height:6px}
.dispute .why{font-size:13.5px;color:var(--ink-2)}
.link-btn{align-self:flex-start;font:500 12.5px/1 var(--sans);background:transparent;border:0;color:var(--sea);padding:2px 0;cursor:pointer}
.share{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.share .top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}
.share pre{margin:0;font:400 12px/1.6 var(--mono);white-space:pre-wrap;background:#fff;border:1px solid var(--rule-3);
           border-radius:5px;padding:10px 12px;max-height:260px;overflow:auto}

/* dispute bar */
.dispute-bar{position:sticky;bottom:18px;z-index:10;background:var(--ink);color:var(--sand);border-radius:10px;
             padding:12px 12px 12px 16px;box-shadow:0 10px 30px rgba(26,28,46,.25);display:flex;flex-wrap:wrap;
             gap:10px;align-items:center;animation:vslide .18s ease-out}
.dispute-bar .what{display:flex;flex-direction:column;gap:2px;min-width:120px}
.dispute-bar .what b{font-size:13.5px}
.dispute-bar .what span{font:400 11px/1.3 var(--mono);color:#a9adba}
.dispute-bar input{flex:1 1 240px;min-width:0;font:inherit;font-size:13.5px;border:1px solid #3a3d52;border-radius:6px;
                   padding:9px 11px;background:#24273b;color:var(--sand);outline:none}
.dispute-bar .cancel{font:500 13px/1 var(--sans);background:transparent;border:0;color:#a9adba;padding:9px 8px;cursor:pointer}
.dispute-bar .send{font:600 13px/1 var(--sans);background:var(--sand);color:var(--ink);border:0;border-radius:6px;padding:10px 14px;cursor:pointer}
.dispute-bar .send:disabled{background:#3a3d52;color:#7d8194;cursor:default}
.dispute-bar .bar-error{flex-basis:100%;font-size:12.5px;color:#f3b4ae;white-space:pre-wrap}
@media (max-width:760px){aside{flex-basis:100%;border-right:0;border-bottom:1px solid #e3dfd7}.cols{columns:1}}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand"><b>Verifier</b>
      <span class="host"><span class="dot" style="background:#067647;width:6px;height:6px"></span>127.0.0.1</span></div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="drop" id="drop"><b>Drop a paper or a project</b>
        <span>One or more <span class="mono">.tex</span> / <span class="mono">.md</span> files, or one
        <span class="mono">.zip</span> of the project. Click to choose.</span></div>
      <input type="file" id="files" multiple hidden>
      <div class="chips" id="chosen"></div>
      <div id="upload-error"></div>
      <div style="display:flex;align-items:center;gap:10px">
        <button class="btn" id="go" disabled>Verify</button>
        <button class="btn-quiet" id="clear" hidden>Clear</button>
      </div>
      <div class="hint">Each run uses the auditing agent and costs model money.</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <div class="runs-head"><span class="label">Runs</span><span class="mono" id="run-count"></span></div>
      <div id="runs"></div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<script>
"use strict";
const HEADERS = {"X-Verifier-Web": "1"};
// The six axes of the triage board, in the order of the severity bar, with their colours
// (TypstReportRenderer.AXIS_COLOURS) and the words of their tags.
const AX = {
  missing_inputs: {name: "Missing input", effect: "Cannot pass", c: "#6941c6"},
  integrity: {name: "Integrity", effect: "Rejecting", c: "#b42318"},
  soundness: {name: "Soundness", effect: "Blocking", c: "#c4320a"},
  presentation: {name: "Presentation", effect: "Blocking", c: "#b54708"},
  strength: {name: "Strength", effect: "Disclosure", c: "#0e7090"},
  caveat: {name: "Caveat", effect: "Not blocking", c: "#667085"}};
const AX_ORDER = ["missing_inputs", "integrity", "soundness", "presentation", "strength", "caveat"];
// Each verdict: its colour (VerdictStyle.report_colour) and its short word for the run list.
const V = {
  "MISSING INPUTS": {c: "#6941c6", short: "Missing inputs"}, "REJECT": {c: "#b42318", short: "Reject"},
  "BLOCK UNTIL FIXED": {c: "#b54708", short: "Blocked"},
  "PASS WITH DISCLOSURE": {c: "#0e7090", short: "Pass · disclose"},
  "PASS WITH CAVEATS": {c: "#a15c07", short: "Pass · caveats"}, "PASS": {c: "#067647", short: "Pass"}};
// Each state of a run (run_library): its word and its colour.
const STATE = {
  "preparing": ["Preparing", "#5a6070"], "running": ["Running", "#1b3d6e"],
  "waiting to start": ["Waiting to start", "#5a6070"], "done": ["Done", "#067647"],
  "setup failed": ["Setup failed", "#b32a23"], "stopped on an error": ["Stopped", "#b32a23"]};
const DISPUTE_STATE = {"waiting for a diagnosis": "#a15c07", "diagnosis written": "#1b3d6e", "withdrawn": "#667085"};
// A fact this short, in one paragraph, shows as a box; a longer fact shows as a labelled line
// below the boxes.
const SHORT_FACT = 32;

const ui = {
  chosen: [], runs: [], selected: null, run: null, timer: null,
  picked: new Set(), why: "", filter: null, openDiagnoses: new Set(), confirmDelete: false,
  notice: null, notes: {}, copied: false, barError: null, renderWaits: false};

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"}[c]));
}
function tint(colour, percent) { return `color-mix(in srgb, ${colour} ${percent}%, white)`; }
function plural(n, word) { return `${n} ${word}${n === 1 ? "" : "s"}`; }
function size(bytes) {
  return bytes < 1024 ? `${bytes} B` : bytes < 1048576 ? `${(bytes / 1024).toFixed(0)} KB`
    : `${(bytes / 1048576).toFixed(1)} MB`;
}
function when(iso) {
  const d = new Date(iso), now = new Date(), p = n => String(n).padStart(2, "0");
  const time = `${p(d.getHours())}:${p(d.getMinutes())}`;
  const day = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((day - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
  if (diff === 0) return `Today, ${time}`;
  if (diff === 1) return `Yesterday, ${time}`;
  return `${d.getDate()} ${d.toLocaleString("en", {month: "short"})}, ${time}`;
}
async function api(method, path, body) {
  const opts = {method, headers: {...HEADERS}};
  if (body instanceof FormData) opts.body = body;
  else if (body !== undefined) {
    opts.body = JSON.stringify(body); opts.headers["Content-Type"] = "application/json";
  }
  const r = await fetch(path, opts);
  // a proxy in front of the server, such as a tunnel, can answer with an HTML error page
  const text = await r.text();
  let data;
  try { data = JSON.parse(text); }
  catch { throw new Error(`The server gave HTTP ${r.status} with no JSON answer. Reload the page.`); }
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

// ---------------------------------------------------------------- upload
const drop = document.getElementById("drop"), input = document.getElementById("files");
const go = document.getElementById("go"), clear = document.getElementById("clear");
function choose(files) {
  ui.chosen = [...files];
  document.getElementById("chosen").innerHTML = ui.chosen.map(f =>
    `<span class="file-chip">${esc(f.name)}<span>${size(f.size)}</span></span>`).join("");
  document.getElementById("upload-error").innerHTML = "";
  go.disabled = !ui.chosen.length;
  clear.hidden = !ui.chosen.length;
}
drop.onclick = () => input.click();
input.onchange = () => choose(input.files);
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); choose(e.dataTransfer.files); };
clear.onclick = () => { choose([]); input.value = ""; };
go.onclick = async () => {
  const form = new FormData();
  ui.chosen.forEach(f => form.append("upload", f, f.name));
  go.disabled = true;
  try {
    const made = await api("POST", "/api/runs", form);
    choose([]); input.value = "";
    location.hash = "#" + made.id;
  } catch (e) {
    document.getElementById("upload-error").innerHTML = `<div class="err-line">${esc(e.message)}</div>`;
    go.disabled = false;
  }
};

// ---------------------------------------------------------------- list of runs
async function loadRuns() {
  ui.runs = (await api("GET", "/api/runs")).runs;
  document.getElementById("run-count").textContent = ui.runs.length || "";
  document.getElementById("runs").innerHTML = ui.runs.map(r => {
    const [word, colour] = STATE[r.state] || [r.state, "#5a6070"];
    const v = r.verdict && V[r.verdict];
    const busy = r.state === "running" || r.state === "preparing";
    return `<div class="run-item ${r.id === ui.selected ? "sel" : ""}" onclick="location.hash='#${r.id}'">
      <div class="top"><span class="dot ${busy ? "pulse" : ""}" style="background:${v ? v.c : colour}"></span>
        <span class="name">${esc(r.name)}</span></div>
      <div class="bottom"><span class="sub">${esc(when(r.uploaded_at))} · ${esc(word)}</span>
        ${v ? `<span class="badge" style="color:${v.c};background:${tint(v.c, 10)}">${esc(v.short)}</span>` : ""}</div>
    </div>`;
  }).join("") || `<div class="hint" style="padding:0 8px">No runs yet.</div>`;
}

// ---------------------------------------------------------------- one run
async function loadRun() {
  clearTimeout(ui.timer);
  if (!ui.selected) { ui.run = null; render(); return; }
  try { ui.run = await api("GET", "/api/runs/" + ui.selected); }
  catch (e) {
    ui.run = null;
    document.getElementById("main").innerHTML = `<div class="err-line">${esc(e.message)}</div>`;
    return;
  }
  const flags = new Set((ui.run.report?.issues || []).filter(i => i.disputable && !i.disputed).map(i => i.id));
  ui.picked = new Set([...ui.picked].filter(f => flags.has(f)));
  render();
  // poll faster while the agent works; slower while a dispute waits for its diagnosis
  const busy = ["preparing", "running", "waiting to start"].includes(ui.run.state);
  const waiting = ui.run.disputes.some(d => d.state === "waiting for a diagnosis");
  if (busy || waiting) ui.timer = setTimeout(refresh, busy ? 5000 : 15000);
}
// A new render waits while the person types, so it does not take the text field away.
function render() {
  const main = document.getElementById("main"), active = document.activeElement;
  if (active && main.contains(active) && (active.tagName === "INPUT" || active.tagName === "TEXTAREA")) {
    ui.renderWaits = true;
    return;
  }
  ui.renderWaits = false;
  main.innerHTML = ui.run ? renderRun(ui.run)
    : `<div class="empty"><b>No run selected</b><span>Upload a paper on the left, or pick a run.</span></div>`;
}
document.addEventListener("focusout", () => setTimeout(() => { if (ui.renderWaits) render(); }, 0));

function renderRun(run) {
  return [renderHead(run), renderProgress(run),
          ui.notice ? `<div class="notice"><span>${esc(ui.notice)}</span><button onclick="dismissNotice()">Dismiss</button></div>` : "",
          run.requests.length ? renderRequests(run) : "",
          run.report ? renderReport(run) : "",
          // a run with disputes shows them in the report, before its first section
          run.report && !(run.report.layout && run.disputes.length) ? renderDisputes(run) : "",
          ui.picked.size ? renderDisputeBar() : ""].join("");
}
function renderHead(run) {
  const [word, colour] = STATE[run.state] || [run.state, "#5a6070"];
  const busy = run.state === "running" || run.state === "preparing";
  const s = run.status, round = s && s.round;
  const bits = [`<span class="state" style="color:${colour}"><span class="dot ${busy ? "pulse" : ""}" style="background:${colour}"></span>${esc(word)}</span>`,
                `<span>${esc(when(run.uploaded_at))}</span>`];
  if (round) bits.push(`<span>Round ${round.n} ${round.ended ? (round.error ? "failed" : "ended") : "in progress"}</span>`);
  if (s) bits.push(`<span class="mono" style="font-size:12.5px">$${(s.spending.cost ?? 0).toFixed(2)} spent</span>`);
  const remove = ui.confirmDelete
    ? `<div class="confirm"><span>Delete the run, its report and disputes?</span>
        <button class="keep" onclick="askDelete(false)">Keep</button>
        <button class="go" onclick="deleteRun()">Delete</button></div>`
    : `<button class="del" onclick="askDelete(true)">Delete run</button>`;
  return `<header class="run-head">
    <div class="row1"><div style="min-width:0"><div class="run-id">${esc(run.id)}</div><h1>${esc(run.name)}</h1></div>
      <div class="actions">${run.has_pdf ? `<a class="pdf" href="/api/runs/${run.id}/report.pdf" target="_blank">Open PDF report ↗</a>` : ""}${remove}</div></div>
    <div class="status">${bits.join("")}</div>
    <div class="chips">${run.files.map(f => `<span class="file-tag">${esc(f)}</span>`).join("")}</div>
  </header>`;
}
function renderProgress(run) {
  if (run.state === "setup failed")
    return `<div class="fail"><div class="head"><b>The setup failed</b>
      <span>The files were saved, but <span class="mono">verifier init</span> stopped. Fix the cause and upload the files again.</span></div>
      <pre>${esc(run.setup_error)}</pre></div>`;
  const out = [];
  const s = run.status, round = s && s.round;
  if (s && s.stopped_because) out.push(`<div class="err-line">The daemon stopped: ${esc(s.stopped_because)}</div>`);
  if (round && round.error) out.push(`<div class="err-line">Round ${round.n} failed: ${esc(round.error)}</div>`);
  if (!run.report && ["preparing", "running", "waiting to start"].includes(run.state)) {
    const preparing = run.state === "preparing";
    const step = (label, sub, status) => `<div class="step">
      <div class="bar ${status === "active" ? "pulse" : ""}" style="background:${status === "todo" ? "#e3dfd7" : "#1b3d6e"}"></div>
      <b style="color:${status === "todo" ? "#8a8f9c" : "#1a1c2e"}">${esc(label)}</b><span>${esc(sub)}</span></div>`;
    out.push(`<div class="panel steps">
      ${step("Uploaded", run.files.join(", "), "done")}
      ${step("Prepared", "A git repository, then verifier init.", preparing ? "active" : "done")}
      ${step(`Round ${round ? round.n : 1}`, "The agent reads the project. The first round can take an hour or more.", preparing ? "todo" : "active")}
      ${step("Report", "The verdict and its flags show here.", "todo")}</div>`);

function renderRequests(run) {
  return `<section style="display:flex;flex-direction:column;gap:10px">
    <div class="ask-head"><span class="dot pulse" style="background:#a15c07"></span><span class="label">The auditing agent needs an answer</span></div>
    ${run.requests.map(q => `<div class="question">
      <div class="q"><span class="mono">${esc(q.id)}</span><b>${esc(q.question)}</b></div>
      <pre class="evidence">${esc(q.evidence)}</pre>
      <div class="hint" style="font-size:12.5px">Asked by the ${esc(q.raised_by)}, because ${esc(q.reason)}</div>
      <div class="options">${Object.entries(q.options).map(([option, effect]) =>
        `<button class="option" onclick="decide('${esc(q.id)}','${esc(option)}')"><span class="mono">${esc(option)}</span><span>${esc(effect)}</span></button>`).join("")}</div>
      <input class="text-input" id="note-${esc(q.id)}" value="${esc(ui.notes[q.id] || "")}"
        oninput="ui.notes['${esc(q.id)}']=this.value" placeholder="Add a note for the agent (optional)">
    </div>`).join("")}</section>`;
}

// ---------------------------------------------------------------- the report
// The report is drawn from the layout data of the PDF (TypstReportRenderer.report_layout_data),
// so the page and the PDF show the same sections, groups and flags.
function renderReport(run) {
  const r = run.report, data = r.layout;
  const disputesFirst = run.disputes.length > 0;
  if (!data) return `<section class="panel" style="padding:16px 18px">This report has no layout data,
    because an older Verifier wrote it. Open the PDF report to read it.</section>`;
  const disputeIds = Object.fromEntries(r.issues.filter(i => i.disputed).map(i => [i.id, i.disputed.dispute_id]));
  const disputable = new Set(r.issues.filter(i => i.disputable && !i.disputed).map(i => i.id));
  const sections = data.sections.map(s => ({...s, groups: s.groups.map(groupRows)}));
  const shown = sections.map(s => ({...s, groups: s.groups
    .map(g => ({...g, rows: ui.filter ? g.rows.filter(x => x.axis === ui.filter) : g.rows}))
    .filter(g => g.rows.length)}))
    .filter(s => s.groups.length || (s["is-caveats"] && data["not-run"].length && !ui.filter));
  const counts = Object.fromEntries(data.severities.map(([axis, , n]) => [axis, Number(n)]));
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  const out = [renderVerdict(data)];
  if (total) out.push(`<section class="filters">
    <div class="sevbar">${AX_ORDER.filter(a => counts[a]).map(a =>
      `<div title="${esc(AX[a].name)}: ${counts[a]}" style="flex:${counts[a]};background:${AX[a].c};opacity:${ui.filter && ui.filter !== a ? .25 : 1}"></div>`).join("")}</div>
    <div class="chiprow">
      <button class="chip ${ui.filter ? "" : "on"}" onclick="setFilter(null)">All <span class="n">${total}</span></button>
      ${AX_ORDER.filter(a => counts[a]).map(a => `<button class="chip ${ui.filter === a ? "on" : ""}" onclick="setFilter('${a}')">
        <span class="sq" style="background:${AX[a].c}"></span>${esc(AX[a].name)} <span class="n">${counts[a]}</span></button>`).join("")}
      <span class="spacer"></span>
      ${disputesFirst ? `<button class="navlink" onclick="jump('disputes')">Disputes</button>` : ""}
      ${data.sections.filter(s => s["issue-count"] > 0).map(s =>
        `<button class="navlink" onclick="jump('${s.anchor}')">${esc(s.heading.replace(/ Needing Attention$/i, ""))}</button>`).join("")}
      ${disputesFirst ? "" : `<button class="navlink" onclick="jump('disputes')">Disputes</button>`}
    </div></section>`);
  if (disputesFirst) out.push(renderDisputes(run));
  for (const s of shown) {
    out.push(`<section class="section" id="${s.anchor}"><div class="section-head"><h2>${esc(s.heading)}</h2>
      ${s.note ? `<div class="note">${esc(s.note)}</div>` : ""}
      ${s.warning ? `<div class="warning">${esc(s.warning)}</div>` : ""}</div>`);
    for (const g of s.groups) out.push(renderGroup(g, disputable, disputeIds));
    if (s["is-caveats"] && data["not-run"].length && !ui.filter) out.push(renderNotRun(data));
    out.push(`</section>`);
  }
  if (!shown.length && ui.filter) out.push(`<div class="filtered-empty">No issues of this severity.</div>`);
  if (data.measures.length && !ui.filter) out.push(`<details class="fold">
    <summary><b>Numbers the claim checks measured (${data.measures.length})</b><span>Show</span></summary>
    <div class="inner table-wrap"><table class="plain"><tr><th>Claim</th><th>Check</th><th class="num">Number</th></tr>
    ${data.measures.map(([claim, check, n]) => `<tr><td class="mono">${esc(claim)}</td><td class="mono">${esc(check)}</td><td class="num">${esc(n)}</td></tr>`).join("")}
    </table></div></details>`);
  if (!data.sections.length && !data.measures.length) out.push(`<div class="none-yet">Nothing to report.</div>`);
  return out.join("");
}
function renderVerdict(data) {
  const v = data.verdict, c = data["verdict-colour"], after = data["verdict-without"];
  const facts = data.facts.map(([k, text]) => `<div><dt>${esc(k)}</dt><dd>${esc(text)}</dd></div>`).join("");
  return `<section class="panel verdict"><div class="top" style="background:${tint(c, 9)}">
      <div class="eyebrow"><span class="label" style="color:${c}">Verdict</span>
        ${data.commit ? `<span class="commit">commit ${esc(data.commit)}</span>` : ""}</div>
      <div class="word" style="color:${c};${after ? "text-decoration:line-through;opacity:.6" : ""}">${esc(v)}</div>
      <div class="action">${esc(data.action)}</div>
      ${data.reason ? `<div class="reason">${esc(data.reason)}</div>` : ""}
      ${after ? `<div class="without"><span>Without the disputed flags (${esc(data["disputed-flags-removed"])}):</span>
        <b style="color:${data["verdict-without-colour"]}">${esc(after)}</b></div>` : ""}
    </div>${facts ? `<dl>${facts}</dl>` : ""}</section>`;
}
// One group of the layout data as a header and a list of flag rows, each with its axis.
function groupRows(g) {
  if (g.kind === "claim") return {anchor: g.anchor, eyebrow: g.place, title: g["claim-id"],
    count: g["count-words"], statement: g.statement, inferred: g["inferred-from"],
    rows: g.issues.map(it => ({flag: it.flag, axis: it.axis, code: it.code, subject: null,
      detail: it.detail, quote: it.quote, facts: it.facts, measured: null, why: it.why}))};
  // the section gives the warning of its types once, as the PDF does
  const head = {anchor: g.anchor, eyebrow: null, title: g.code, count: g["count-words"],
    shared: g.shared, two: false};
  if (g.same != null) return {...head, same: g.same, two: g.subjects.length > 3,
    rows: g.subjects.map((s, k) => ({flag: g["flag-ids"][k], axis: g.axis, code: null, subject: s,
      detail: null, quote: null, facts: [], measured: null, why: g["dispute-reasons"][k]}))};
  // a table or a card shows only the facts of each flag, as the PDF does
  const factsOnly = g.table || g.cards;
  return {...head, rows: g.issues.map(it => ({flag: it[5], axis: g.axis, code: null,
    subject: g.shared != null ? null : it[0], detail: factsOnly ? null : it[1],
    quote: factsOnly ? null : it[2], facts: it[3], measured: it[4], why: it[6]}))};
}
function renderGroup(g, disputable, disputeIds) {
  const head = `<div class="group-head">
    <div class="line">${g.eyebrow ? `<span class="eyebrow">${esc(g.eyebrow)}</span>` : ""}
      <span class="title">${esc(g.title)}</span><span class="count">${esc(g.count)}</span></div>
    ${g.statement ? `<div class="statement">${esc(g.statement)}</div>` : ""}
    ${g.inferred ? `<div class="small">${esc(g.inferred)}.</div>` : ""}
    ${g.shared ? `<div class="small">In <span class="mono">${esc(g.shared)}</span>:</div>` : ""}</div>`;
  const same = g.same ? `<div class="same-note">All ${g.rows.length} say: <i>${esc(g.same)}</i></div>` : "";
  const rows = g.rows.map(x => renderRow(x, disputable, disputeIds)).join("");
  return `<div class="group" id="${g.anchor}">${head}${same}<div class="${g.two ? "cols" : ""}">${rows}</div></div>`;
}
function renderRow(x, disputable, disputeIds) {
  const a = AX[x.axis], picked = ui.picked.has(x.flag), canPick = x.why == null && disputable.has(x.flag);
  const box = canPick ? `<button class="pick ${picked ? "on" : ""}" title="Select ${esc(x.flag)} to dispute"
    onclick="togglePick('${esc(x.flag)}')">${picked ? "✓" : ""}</button>` : "";
  return `<div class="row ${picked ? "picked" : ""} ${x.why != null ? "struck" : ""}"><div>${box}</div><div class="row-body">
    <div class="row-line"><span class="flag-id">${esc(x.flag)}</span>
      ${x.subject ? `<span class="subject">${esc(x.subject)}</span>` : ""}
      ${x.code ? `<span class="code">${esc(x.code)}</span>` : ""}
      <span class="spacer"></span>
      ${x.measured != null ? `<span class="badge mono" style="color:${a.c};background:${tint(a.c, 10)}">${esc(x.measured)}</span>` : ""}
      <span class="badge" style="color:${a.c};background:${tint(a.c, 12)}">${esc(a.name)} · ${esc(a.effect)}</span></div>
    ${x.detail ? `<div class="detail">${esc(x.detail)}</div>` : ""}
    ${x.quote ? `<div class="quote">${esc(x.quote)}</div>` : ""}
    ${x.facts.length ? renderFacts(x.facts) : ""}
    ${x.why != null ? `<div class="disputed-note"><span class="mono">${esc(disputeIds[x.flag] || "")}</span><span>Disputed: ${esc(x.why)}</span></div>` : ""}
  </div></div>`;
}
// Each fact is [label, text, fixed-width, parts] (TypstReportRenderer.fact_data).
function renderFacts(facts) {
  const isShort = ([, text, , parts]) => text.length <= SHORT_FACT && parts.length <= 1;
  const boxes = facts.filter(isShort), lines = facts.filter(f => !isShort(f));
  return (boxes.length ? `<div class="facts">${boxes.map(([k, text]) =>
    `<div><span class="fact-k">${esc(k)}</span><span class="fact-v">${esc(text)}</span></div>`).join("")}</div>` : "")
    + (lines.length ? `<div class="long-facts">${lines.map(([k, text, isMono, parts]) =>
    `<span class="fact-k" style="padding-top:3px">${esc(k)}</span>
     <div class="fact-v">${isMono ? `<span class="mono" style="font-size:12.5px">${esc(text)}</span>` : factBody(parts)}</div>`).join("")}</div>` : "");
}
function factBody(parts) {
  const out = [];
  let items = [];
  const flush = () => { if (items.length) out.push(`<ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`); items = []; };
  for (const [isBullet, t] of parts) {
    if (isBullet) { items.push(t); continue; }
    flush();
    out.push(`<p>${esc(t)}</p>`);
  }
  flush();
  return out.join("");
}
function renderNotRun(data) {
  const n = data["not-run"].length;
  return `<details class="fold"><summary><b>${plural(n, "check")} did not run</b><span>Show</span></summary>
    <div class="inner table-wrap"><table class="plain"><tr><th>Check</th><th>Why it did not run</th><th class="num">Claims</th></tr>
    ${data["not-run"].map(([check, why, claims]) => `<tr><td class="mono">${esc(check)}</td><td>${esc(why)}</td><td class="num">${esc(claims)}</td></tr>`).join("")}
    </table>
    ${data["not-run-claims"].map(([name, rows]) => `<h4>Why <span class="mono">${esc(name)}</span> did not run</h4>
      <table class="plain"><tr><th>Claim</th><th>Why it did not run</th></tr>
      ${rows.map(([claim, why]) => `<tr><td class="mono">${esc(claim)}</td><td>${esc(why)}</td></tr>`).join("")}</table>`).join("")}
    </div></details>`;
}

// ---------------------------------------------------------------- disputes
function renderDisputes(run) {
  const p = [`<section class="section" id="disputes"><div class="section-head"><h2>Disputes</h2>
    <div class="note">Tick the box of each false flag, give the reason, and dispute it. The agent writes a diagnosis for each dispute.</div></div>`];
  if (!run.disputes.length) p.push(`<div class="none-yet">No disputes yet.</div>`);
  for (const d of run.disputes) {
    const c = DISPUTE_STATE[d.state] || "#667085", open = ui.openDiagnoses.has(d.id);
    p.push(`<div class="dispute ${d.state === "withdrawn" ? "withdrawn" : ""}">
      <div class="top"><div class="ids"><span class="mono">${esc(d.id)}</span>
        ${d.flags.map(f => `<span class="flag-chip">${esc(f)}</span>`).join("")}
        <span class="state-pill" style="color:${c};background:${tint(c, 10)}"><span class="dot ${d.state === "waiting for a diagnosis" ? "pulse" : ""}" style="background:${c}"></span>${esc(d.state)}</span></div>
        ${d.state !== "withdrawn" ? `<button class="btn-line" style="color:var(--ink-2)" onclick="withdraw('${esc(d.id)}')">Withdraw</button>` : ""}</div>
      <div class="why">${esc(d.reason)}</div>
      ${d.diagnosis ? `<button class="link-btn" onclick="toggleDiagnosis('${esc(d.id)}')">${open ? "Hide the diagnosis" : "Read the diagnosis"}</button>
        ${open ? `<pre class="evidence">${esc(d.diagnosis)}</pre>` : ""}` : ""}
    </div>`);
  }
  if (run.disputes.some(d => d.diagnosis && d.state !== "withdrawn")) {
    p.push(`<div class="panel share"><div class="top"><div style="display:flex;flex-direction:column;gap:3px;max-width:560px">
      <b style="font-size:14px">Share the diagnoses with the Verifier developers</b>
      <span class="hint" style="font-size:12.5px">Read it to double-check its anonymity before you send it to verifier@meno.sh.</span></div>
      <button class="btn" style="font-size:13px;padding:9px 13px" onclick="share()">${run.share_file ? "Make it again" : "Make the share file"}</button></div>`);
    if (run.share_file) p.push(`<pre id="share-text">${esc(run.share_file)}</pre>
      <div style="display:flex;gap:8px"><button class="btn-line" onclick="copyShare()">${ui.copied ? "Copied" : "Copy"}</button>
      <a class="btn-line" download="verifier-diagnoses.md" href="data:text/markdown;charset=utf-8,${encodeURIComponent(run.share_file)}">Download .md</a></div>`);
    p.push(`</div>`);
  }
  p.push(`</section>`);
  return p.join("");
}
function renderDisputeBar() {
  const ids = [...ui.picked];
  return `<div class="dispute-bar"><div class="what"><b>${plural(ids.length, "flag")} selected</b><span>${esc(ids.join("  "))}</span></div>
    <input id="why" value="${esc(ui.why)}" placeholder="Why are these flags false?"
      oninput="ui.why=this.value;document.getElementById('send').disabled=!this.value.trim()"
      onkeydown="if(event.key==='Enter'&&this.value.trim())dispute()">
    <button class="cancel" onclick="clearPicked()">Cancel</button>
    <button class="send" id="send" onclick="dispute()" ${ui.why.trim() ? "" : "disabled"}>Dispute</button>
    ${ui.barError ? `<div class="bar-error">${esc(ui.barError)}</div>` : ""}</div>`;
}

// ---------------------------------------------------------------- actions
function setFilter(axis) { ui.filter = axis; render(); }
function jump(anchor) { document.getElementById(anchor)?.scrollIntoView({behavior: "smooth"}); }
function togglePick(flag) {
  if (ui.picked.has(flag)) ui.picked.delete(flag); else ui.picked.add(flag);
  ui.barError = null; render();
}
function clearPicked() { ui.picked.clear(); ui.why = ""; ui.barError = null; render(); }
function toggleDiagnosis(id) {
  if (ui.openDiagnoses.has(id)) ui.openDiagnoses.delete(id); else ui.openDiagnoses.add(id);
  render();
}
function askDelete(yes) { ui.confirmDelete = yes; render(); }
function dismissNotice() { ui.notice = null; render(); }
async function act(method, path, body, notice) {
  document.activeElement?.blur();
  try {
    await api(method, path, body);
    ui.notice = notice;
    return true;
  } catch (e) {
    ui.notice = null;
    ui.barError = e.message;
    if (!ui.picked.size) alert(e.message);
    return false;
  } finally {
    await refresh();
  }
}
async function dispute() {
  const flags = [...ui.picked], why = ui.why;
  ui.barError = null;
  if (await act("POST", `/api/runs/${ui.selected}/disputes`, {flags, why},
                `${plural(flags.length, "flag")} disputed. The auditing agent writes its diagnosis in its next round.`)) {
    ui.picked.clear(); ui.why = ""; render();
  }
}
function withdraw(id) {
  act("POST", `/api/runs/${ui.selected}/withdrawals`, {dispute: id}, `${id} is withdrawn. Its flags count again.`);
}
function decide(request, option) {
  act("POST", `/api/runs/${ui.selected}/decisions`, {request, option, note: ui.notes[request] || ""},
      `Your answer to ${request} is recorded: ${option}. The auditing agent reads it in its next round.`);
}
function share() { act("POST", `/api/runs/${ui.selected}/share`, {}, null); }
function copyShare() {
  navigator.clipboard.writeText(document.getElementById("share-text").textContent);
  ui.copied = true; render();
  setTimeout(() => { ui.copied = false; render(); }, 1500);
}
async function deleteRun() {
  ui.confirmDelete = false;
  try { await api("DELETE", `/api/runs/${ui.selected}`); } catch (e) { alert(e.message); }
  location.hash = "";
  await refresh();
}

// ---------------------------------------------------------------- routing
async function refresh() {
  const selected = location.hash.slice(1) || null;
  if (selected !== ui.selected) {
    Object.assign(ui, {selected, picked: new Set(), why: "", filter: null, confirmDelete: false,
                       notice: null, barError: null, openDiagnoses: new Set()});
  }
  await Promise.all([loadRuns(), loadRun()]);
}
window.onhashchange = refresh;
refresh();
// a failed refresh of the list keeps the list that the page shows
setInterval(() => loadRuns().catch(() => {}), 15000);
</script>
</body>
</html>
